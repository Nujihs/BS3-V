{% extends 'base.html' %}

{% block title %}修改密码{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="bg-white rounded-lg shadow-lg p-6">
        <div class="flex items-center mb-6">
            <a href="{{ url_for('view_user', user_id=user.id) }}" class="text-blue-600 hover:text-blue-800 mr-4">
                <i class="ri-arrow-left-line text-2xl"></i>
            </a>
            <h3 class="text-xl font-bold text-gray-800">修改密码</h3>
        </div>

        <div class="mb-6 bg-blue-50 p-4 rounded-lg">
            <div class="flex items-center">
                <i class="ri-user-line text-2xl text-blue-600 mr-3"></i>
                <div>
                    <p class="font-semibold text-gray-800">{{ user.username }}</p>
                    <p class="text-sm text-gray-500">ID: #{{ user.id }}</p>
                </div>
            </div>
        </div>

        {% if error %}
        <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-6">
            <i class="ri-error-warning-line"></i>
            {{ error }}
        </div>
        {% endif %}

        {% if success %}
        <div class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded mb-6">
            <i class="ri-checkbox-circle-line"></i>
            {{ success }}
        </div>
        {% endif %}

        <form method="POST" action="{{ url_for('change_password', user_id=user.id) }}">
            <div class="space-y-6">
                <div>
                    <label class="block text-gray-700 text-sm font-bold mb-2" for="password">
                        新密码 <span class="text-red-500">*</span>
                    </label>
                    <div class="relative">
                        <input
                            type="password"
                            id="password"
                            name="password"
                            required
                            minlength="6"
                            class="w-full px-4 py-3 pl-10 border-2 border-gray-300 rounded-lg focus:outline-none focus:border-blue-500 transition"
                            placeholder="请输入新密码（至少6字符）"
                        >
                        <i class="ri-lock-line absolute left-3 top-3.5 text-gray-400 text-xl"></i>
                    </div>
                </div>

                <div>
                    <label class="block text-gray-700 text-sm font-bold mb-2" for="confirm_password">
                        确认密码 <span class="text-red-500">*</span>
                    </label>
                    <div class="relative">
                        <input
                            type="password"
                            id="confirm_password"
                            name="confirm_password"
                            required
                            class="w-full px-4 py-3 pl-10 border-2 border-gray-300 rounded-lg focus:outline-none focus:border-blue-500 transition"
                            placeholder="请再次输入新密码"
                        >
                        <i class="ri-lock-password-line absolute left-3 top-3.5 text-gray-400 text-xl"></i>
                    </div>
                </div>

                <div class="bg-yellow-50 p-4 rounded-lg">
                    <p class="text-sm text-yellow-800">
                        <i class="ri-information-line mr-1"></i>
                        提示：密码将被加密存储，修改后用户需要使用新密码登录。
                    </p>
                </div>

                <div class="flex items-center justify-end space-x-4 pt-4">
                    <a href="{{ url_for('view_user', user_id=user.id) }}"
                       class="px-6 py-3 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300 transition">
                        取消
                    </a>
                    <button
                        type="submit"
                        class="px-6 py-3 bg-yellow-600 text-white rounded-lg hover:bg-yellow-700 transition">
                        修改密码
                    </button>
                </div>
            </div>
        </form>
    </div>
</div>

<script>
// 密码确认验证
document.getElementById('confirm_password').addEventListener('input', function() {
    const password = document.getElementById('password').value;
    const confirmPassword = this.value;

    if (password !== confirmPassword) {
        this.setCustomValidity('两次输入的密码不一致');
    } else {
        this.setCustomValidity('');
    }
});

document.getElementById('password').addEventListener('input', function() {
    const confirmPassword = document.getElementById('confirm_password');
    if (confirmPassword.value) {
        if (this.value !== confirmPassword.value) {
            confirmPassword.setCustomValidity('两次输入的密码不一致');
        } else {
            confirmPassword.setCustomValidity('');
        }
    }
});
</script>
{% endblock %}
