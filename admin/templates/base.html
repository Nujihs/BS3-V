<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>口琴谱生成器 Jianpu to BD - 后台管理</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link id="favicon" rel="icon" type="image/jpeg" href="{{ url_for('static', filename='images/黒蝠.jpg') }}?v=2">
    <style>
        body {
            font-family: 'Microsoft YaHei', sans-serif;
        }
        /* 使用CSS变量定义统一的主题色 */
        :root {
            --theme-blue-primary: #2563eb;
            --theme-blue-hover: #1d4ed8;
            --theme-blue-text: #2563eb;
        }
        .sidebar {
            background: linear-gradient(180deg, #1e40af 0%, #2563eb 100%);
            transition: all 0.3s;
        }
        .sidebar.light-mode {
            background: linear-gradient(180deg, #3b82f6 0%, #60a5fa 100%);
        }
        /* 顶部标题栏 - 与侧边栏颜色一致 */
        .top-bar {
            background: linear-gradient(90deg, #1e40af 0%, #2563eb 100%);
            transition: all 0.3s;
        }
        body.light-mode .top-bar {
            background: linear-gradient(90deg, #3b82f6 0%, #60a5fa 100%);
        }
        /* 登录页面背景 - 与侧边栏颜色一致 */
        .login-bg {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            transition: all 0.3s;
        }
        body.light-mode .login-bg {
            background: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);
        }

        /* 登录卡片样式 - 与侧边栏颜色互换 */
        .login-card {
            background: linear-gradient(135deg, #1e40af 0%, #2563eb 100%);
            transition: all 0.3s;
        }
        body.light-mode .login-card {
            background: linear-gradient(135deg, #3b82f6 0%, #60a5fa 100%);
        }

        /* 登录页面文字颜色 */
        .login-title {
            color: white;
            transition: all 0.3s;
        }
        body.light-mode .login-title {
            color: #1e3a8a;
        }

        .login-subtitle {
            color: rgba(255, 255, 255, 0.9);
            transition: all 0.3s;
        }
        body.light-mode .login-subtitle {
            color: #1e40af;
        }

        /* 登录表单标签 */
        .login-label {
            color: rgba(255, 255, 255, 0.95);
            transition: all 0.3s;
        }
        body.light-mode .login-label {
            color: #1e3a8a;
        }

        /* 登录输入框 */
        .login-input {
            background: rgba(255, 255, 255, 0.95);
            border: 2px solid rgba(255, 255, 255, 0.3);
            color: #1f2937;
            transition: all 0.3s;
        }
        .login-input:focus {
            background: white;
            border-color: rgba(255, 255, 255, 0.8);
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.2);
        }
        body.light-mode .login-input {
            background: white;
            border: 2px solid #bfdbfe;
            color: #1f2937;
        }
        body.light-mode .login-input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        /* 登录图标 */
        .login-icon {
            color: rgba(255, 255, 255, 0.7);
            transition: all 0.3s;
        }
        body.light-mode .login-icon {
            color: #9ca3af;
        }

        /* 登录复选框 */
        .login-checkbox {
            color: rgba(255, 255, 255, 0.9);
            transition: all 0.3s;
        }
        body.light-mode .login-checkbox {
            color: #475569;
        }

        /* 登录链接 */
        .login-link {
            color: rgba(255, 255, 255, 0.9);
            transition: all 0.3s;
        }
        .login-link:hover {
            color: white;
            text-decoration: underline;
        }
        body.light-mode .login-link {
            color: #2563eb;
        }
        body.light-mode .login-link:hover {
            color: #1d4ed8;
        }

        /* 登录按钮 */
        .login-btn {
            background: white;
            color: #2563eb;
            transition: all 0.3s;
        }
        .login-btn:hover {
            background: rgba(255, 255, 255, 0.95);
            color: #1d4ed8;
        }
        body.light-mode .login-btn {
            background: #1e40af;
            color: white;
        }
        body.light-mode .login-btn:hover {
            background: #1e3a8a;
        }

        /* 登录错误信息 */
        .login-error {
            background: rgba(239, 68, 68, 0.2);
            border: 2px solid rgba(239, 68, 68, 0.6);
            color: #fecaca;
            transition: all 0.3s;
        }
        body.light-mode .login-error {
            background: #fef2f2;
            border: 2px solid #ef4444;
            color: #dc2626;
        }

        /* 登录底部文字 */
        .login-footer {
            color: rgba(255, 255, 255, 0.8);
            transition: all 0.3s;
        }
        body.light-mode .login-footer {
            color: #64748b;
        }

        /* 登录页面的模式切换按钮 */
        .login-mode-btn {
            background: rgba(255, 255, 255, 0.15);
            transition: all 0.3s;
        }
        .login-mode-btn:hover {
            background: rgba(255, 255, 255, 0.25);
        }
        body.light-mode .login-mode-btn {
            background: rgba(255, 255, 255, 0.25);
        }
        body.light-mode .login-mode-btn:hover {
            background: rgba(255, 255, 255, 0.35);
        }
        /* 统一的主色调 - 暗色模式 */
        .theme-primary {
            background-color: var(--theme-blue-primary) !important;
        }
        .theme-primary:hover {
            background-color: var(--theme-blue-hover) !important;
        }
        /* 统一的文本色 */
        .theme-text {
            color: var(--theme-blue-text) !important;
        }
        /* 统一的头像背景色 */
        .theme-avatar {
            background-color: var(--theme-blue-primary) !important;
        }
        .sidebar-item {
            transition: all 0.3s;
        }
        .sidebar-item:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateX(5px);
        }
        .card {
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
        }
        .stat-card {
            background: linear-gradient(135deg, var(--theme-blue-primary, #2563eb) 0%, var(--theme-blue-hover, #1d4ed8) 100%);
        }
        .table-hover tbody tr:hover {
            background-color: #f8fafc;
        }

        /* 暗色模式适配 */
        .dark-mode\:bg-gray-800 {
            background-color: #1f2937 !important;
        }
        .dark-mode\:bg-gray-700 {
            background-color: #374151 !important;
        }
        .dark-mode\:text-white {
            color: white !important;
        }
        .dark-mode\:text-gray-300 {
            color: #d1d5db !important;
        }
        .dark-mode\:text-gray-400 {
            color: #9ca3af !important;
        }
        .dark-mode\:shadow-gray-900 {
            box-shadow: 0 1px 3px rgba(17, 24, 39, 0.1) !important;
        }

        /* 暗色模式下的卡片样式 */
        body.bg-gray-900 .bg-white {
            background-color: #1f2937 !important;
        }

        /* 统一蓝色主题色 - 覆盖Tailwind类 */
        .bg-blue-600 {
            background-color: var(--theme-blue-primary, #2563eb) !important;
        }
        .bg-blue-600:hover {
            background-color: var(--theme-blue-hover, #1d4ed8) !important;
        }
        .bg-blue-500 {
            background-color: var(--theme-blue-primary, #2563eb) !important;
        }
        .text-blue-600 {
            color: var(--theme-blue-text, #2563eb) !important;
        }
        .text-blue-600:hover {
            color: var(--theme-blue-hover, #1d4ed8) !important;
        }
        .text-blue-800 {
            color: var(--theme-blue-hover, #1d4ed8) !important;
        }
        .bg-blue-100 {
            background-color: rgba(37, 99, 235, 0.1) !important;
        }
        .text-blue-800 {
            color: var(--theme-blue-primary, #2563eb) !important;
        }
        .border-blue-500 {
            border-color: var(--theme-blue-primary, #2563eb) !important;
        }
        /* 亮色模式下的蓝色调整 */
        body.light-mode {
            --theme-blue-primary: #3b82f6;
            --theme-blue-hover: #60a5fa;
            --theme-blue-text: #3b82f6;
        }
        /* 暗色模式下的蓝色调整 */
        body:not(.light-mode) {
            --theme-blue-primary: #2563eb;
            --theme-blue-hover: #1d4ed8;
            --theme-blue-text: #2563eb;
        }
        /* 暗色模式下的表格文字 */
        body:not(.light-mode) .text-gray-900 {
            color: #e5e7eb !important;
        }
        body:not(.light-mode) .text-gray-800 {
            color: #e5e7eb !important;
        }
        body:not(.light-mode) .text-gray-700 {
            color: #e5e7eb !important;
        }
        body:not(.light-mode) .text-gray-600 {
            color: #d1d5db !important;
        }
        body:not(.light-mode) .text-gray-500 {
            color: #9ca3af !important;
        }
        body.bg-gray-900 .text-gray-800 {
            color: white !important;
        }
        body.bg-gray-900 .text-gray-700 {
            color: #e5e7eb !important;
        }
        body.bg-gray-900 .text-gray-600 {
            color: #d1d5db !important;
        }
        body.bg-gray-900 .text-gray-500 {
            color: #9ca3af !important;
        }
        body.bg-gray-900 .border-gray-300 {
            border-color: #4b5563 !important;
        }
        body.bg-gray-900 .border-gray-200 {
            border-color: #374151 !important;
        }
        body.bg-gray-900 .bg-gray-50 {
            background-color: #374151 !important;
        }
        body.bg-gray-900 .bg-gray-100 {
            background-color: #1f2937 !important;
        }
        body.bg-gray-900 .bg-gray-200 {
            background-color: #374151 !important;
        }
        body.bg-gray-900 input, body.bg-gray-900 textarea {
            background-color: #374151 !important;
            color: white !important;
        }
        body.bg-gray-900 .table-hover tbody tr:hover {
            background-color: #374151 !important;
        }

        /* 移动端响应式设计 */
        .mobile-menu-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 999;
        }

        .mobile-menu-overlay.active {
            display: block;
        }

        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(-100%);
                z-index: 1000;
            }

            .sidebar.active {
                transform: translateX(0);
            }

            #main-content {
                margin-left: 0 !important;
            }

            .mobile-menu-overlay.active {
                display: block;
            }

            #page-title {
                font-size: 1.25rem;
            }

            .top-bar {
                padding: 0.75rem 1rem;
            }
        }
    </style>
</head>
<body class="bg-gray-900 text-white">
    {% if session.get('admin_logged_in') %}
    <div class="flex min-h-screen relative">
        <!-- 移动端遮罩层 -->
        <div class="mobile-menu-overlay" onclick="toggleMobileMenu()"></div>

        <!-- 侧边栏 -->
        <div class="sidebar w-64 text-white fixed h-full transition-transform duration-300" id="sidebar">
            <div class="p-6 flex items-center">
                <img id="admin-logo" src="{{ url_for('static', filename='images/dark-bat.png') }}" alt="Logo" class="w-10 h-10 mr-3">
                <div>
                    <h1 class="text-2xl font-bold">后台管理</h1>
                    <div class="text-blue-200 font-bold text-sm">口琴谱生成器</div>
                    <div class="text-blue-200/80 text-xs">Jianpu to BD</div>
                </div>
            </div>

            <nav class="mt-8">
                <a href="{{ url_for('dashboard') }}" onclick="closeMobileMenu()" class="sidebar-item flex items-center px-6 py-3 text-gray-200 hover:text-white">
                    <i class="ri-dashboard-line mr-3 text-xl"></i>
                    <span>仪表板</span>
                </a>
                <a href="{{ url_for('users') }}" onclick="closeMobileMenu()" class="sidebar-item flex items-center px-6 py-3 text-gray-200 hover:text-white">
                    <i class="ri-user-line mr-3 text-xl"></i>
                    <span>用户管理</span>
                </a>
                <a href="{{ url_for('conversions') }}" onclick="closeMobileMenu()" class="sidebar-item flex items-center px-6 py-3 text-gray-200 hover:text-white">
                    <i class="ri-music-line mr-3 text-xl"></i>
                    <span>转换记录</span>
                </a>
                <a href="{{ url_for('sessions') }}" onclick="closeMobileMenu()" class="sidebar-item flex items-center px-6 py-3 text-gray-200 hover:text-white">
                    <i class="ri-key-2-line mr-3 text-xl"></i>
                    <span>会话管理</span>
                </a>
            </nav>

            <div class="absolute bottom-0 left-0 right-0 p-6 border-t border-blue-800">
                <a href="{{ url_for('logout') }}" class="flex items-center text-gray-300 hover:text-white">
                    <i class="ri-logout-box-line mr-3 text-xl"></i>
                    <span>退出登录</span>
                </a>
            </div>
        </div>

        <!-- 主内容区 -->
        <div class="flex-1 bg-gray-900 transition-colors duration-300 ml-64" id="main-content">
            <div class="top-bar shadow-md p-6 transition-colors duration-300" id="top-bar">
                <div class="flex items-center justify-between">
                    <div class="flex items-center">
                        <button onclick="toggleMobileMenu()" class="mr-4 p-2 rounded-lg hover:bg-white/20 transition-colors md:hidden">
                            <i class="ri-menu-line text-2xl text-white"></i>
                        </button>
                        <h2 class="text-2xl font-bold text-white transition-colors duration-300" id="page-title">{% block title %}仪表板{% endblock %}</h2>
                    </div>
                    <div class="flex items-center gap-4">
                        <button onclick="toggleDarkMode()" class="p-2 rounded-full hover:bg-white/20 transition-colors" title="切换亮色/暗色模式">
                            <i id="mode-icon" class="ri-moon-line text-xl text-white"></i>
                        </button>
                        <div class="text-sm text-white hidden sm:block">
                            <i class="ri-user-smile-line"></i>
                            {{ session.get('admin_username') }}
                        </div>
                    </div>
                </div>
            </div>

            <div class="p-4 md:p-6">
                {% block content %}{% endblock %}
            </div>
        </div>
    </div>
    {% else %}
    <div class="min-h-screen login-bg flex items-center justify-center">
        {% block login_content %}{% endblock %}
    </div>
    {% endif %}

    <script>
        // 移动端菜单切换
        function toggleMobileMenu() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.querySelector('.mobile-menu-overlay');
            sidebar.classList.toggle('active');
            overlay.classList.toggle('active');
        }

        function closeMobileMenu() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.querySelector('.mobile-menu-overlay');
            sidebar.classList.remove('active');
            overlay.classList.remove('active');
        }

        // 暗色/亮色模式切换
        // 从 localStorage 读取保存的模式状态，默认为暗色模式
        let isDarkMode = localStorage.getItem('adminDarkMode') !== 'false';

        // 页面加载时应用保存的模式
        document.addEventListener('DOMContentLoaded', function() {
            applyDarkMode();
        });

        function toggleDarkMode() {
            isDarkMode = !isDarkMode;
            // 保存状态到 localStorage
            localStorage.setItem('adminDarkMode', isDarkMode);
            applyDarkMode();
        }

        function applyDarkMode() {
            const body = document.body;
            const mainContent = document.getElementById('main-content');
            const modeIcon = document.getElementById('mode-icon');
            const loginModeIcon = document.getElementById('login-mode-icon');
            const adminLogo = document.getElementById('admin-logo');
            const favicon = document.getElementById('favicon');
            const sidebar = document.querySelector('.sidebar');
            const loginBg = document.querySelector('.login-bg');
            const loginLogo = document.getElementById('login-logo');

            if (isDarkMode) {
                // 暗色模式
                body.classList.add('bg-gray-900', 'text-white');
                body.classList.remove('bg-gray-100', 'light-mode');
                if (mainContent) {
                    mainContent.classList.add('bg-gray-900');
                }
                if (modeIcon) {
                    modeIcon.classList.remove('ri-moon-line');
                    modeIcon.classList.add('ri-sun-line');
                }
                if (loginModeIcon) {
                    loginModeIcon.classList.remove('ri-moon-line');
                    loginModeIcon.classList.add('ri-sun-line');
                }
                if (sidebar) {
                    sidebar.classList.remove('light-mode');
                }
                if (loginBg) {
                    loginBg.classList.remove('light-mode');
                }
                if (adminLogo) {
                    adminLogo.src = "{{ url_for('static', filename='images/dark-bat.png') }}";
                }
                if (loginLogo) {
                    loginLogo.src = "{{ url_for('static', filename='images/dark-bat.png') }}";
                }
                favicon.href = "{{ url_for('static', filename='images/黒蝠.jpg') }}?v=2";
            } else {
                // 亮色模式
                body.classList.remove('bg-gray-900', 'text-white');
                body.classList.add('bg-gray-100', 'light-mode');
                if (mainContent) {
                    mainContent.classList.remove('bg-gray-900');
                }
                if (modeIcon) {
                    modeIcon.classList.add('ri-moon-line');
                    modeIcon.classList.remove('ri-sun-line');
                }
                if (loginModeIcon) {
                    loginModeIcon.classList.add('ri-moon-line');
                    loginModeIcon.classList.remove('ri-sun-line');
                }
                if (sidebar) {
                    sidebar.classList.add('light-mode');
                }
                if (loginBg) {
                    loginBg.classList.add('light-mode');
                }
                if (adminLogo) {
                    adminLogo.src = "{{ url_for('static', filename='images/light-fish.png') }}";
                }
                if (loginLogo) {
                    loginLogo.src = "{{ url_for('static', filename='images/light-fish.png') }}";
                }
                favicon.href = "{{ url_for('static', filename='images/白鱼.jpg') }}?v=2";
            }
        }
    </script>

    {% block scripts %}{% endblock %}
</body>
</html>
