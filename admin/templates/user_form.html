{% extends 'base.html' %}

{% block title %}{{ '编辑用户' if action == 'edit' else '新建用户' }}{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="bg-white rounded-lg shadow-lg p-6">
        <div class="flex items-center mb-6">
            <a href="{{ url_for('users') }}" class="text-blue-600 hover:text-blue-800 mr-4">
                <i class="ri-arrow-left-line text-2xl"></i>
            </a>
            <h3 class="text-xl font-bold text-gray-800">
                {{ '编辑用户' if action == 'edit' else '新建用户' }}
            </h3>
        </div>
        
        {% if error %}
        <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-6">
            <i class="ri-error-warning-line"></i>
            {{ error }}
        </div>
        {% endif %}
        
        <form method="POST" action="{{ url_for('new_user') if action == 'create' else url_for('edit_user', user_id=user.id) }}">
            <div class="space-y-6">
                <div>
                    <label class="block text-gray-700 text-sm font-bold mb-2" for="username">
                        用户名 <span class="text-red-500">*</span>
                    </label>
                    <div class="relative">
                        <input 
                            type="text" 
                            id="username" 
                            name="username" 
                            required
                            value="{{ user.username if action == 'edit' else '' }}"
                            class="w-full px-4 py-3 pl-10 border-2 border-gray-300 rounded-lg focus:outline-none focus:border-blue-500 transition"
                            placeholder="请输入用户名（3-50字符）"
                        >
                        <i class="ri-user-line absolute left-3 top-3.5 text-gray-400 text-xl"></i>
                    </div>
                </div>
                
                {% if action == 'create' %}
                <div>
                    <label class="block text-gray-700 text-sm font-bold mb-2" for="password">
                        密码 <span class="text-red-500">*</span>
                    </label>
                    <div class="relative">
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            required
                            class="w-full px-4 py-3 pl-10 border-2 border-gray-300 rounded-lg focus:outline-none focus:border-blue-500 transition"
                            placeholder="请输入密码（至少6字符）"
                        >
                        <i class="ri-lock-line absolute left-3 top-3.5 text-gray-400 text-xl"></i>
                    </div>
                </div>
                {% endif %}
                
                <div>
                    <label class="block text-gray-700 text-sm font-bold mb-2" for="email">
                        邮箱
                    </label>
                    <div class="relative">
                        <input 
                            type="email" 
                            id="email" 
                            name="email"
                            value="{{ user.email if action == 'edit' and user.email else '' }}"
                            class="w-full px-4 py-3 pl-10 border-2 border-gray-300 rounded-lg focus:outline-none focus:border-blue-500 transition"
                            placeholder="请输入邮箱（可选）"
                        >
                        <i class="ri-mail-line absolute left-3 top-3.5 text-gray-400 text-xl"></i>
                    </div>
                </div>
                
                <div class="flex items-center justify-end space-x-4 pt-4">
                    <a href="{{ url_for('users') }}" 
                       class="px-6 py-3 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300 transition">
                        取消
                    </a>
                    <button 
                        type="submit" 
                        class="px-6 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition">
                        {{ '更新' if action == 'edit' else '创建' }}
                    </button>
                </div>
            </div>
        </form>
    </div>
</div>
{% endblock %}
