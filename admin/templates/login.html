{% extends 'base.html' %}

{% block login_content %}
<div class="login-card rounded-2xl shadow-2xl p-8 w-full max-w-md transition-all duration-300 relative">
    <!-- 暗夜模式切换按钮 -->
    <button onclick="toggleDarkMode()" class="login-mode-btn absolute top-4 right-4 p-2 rounded-full hover:bg-white/20 transition-colors" title="切换亮色/暗色模式">
        <i id="login-mode-icon" class="ri-moon-line text-xl text-white"></i>
    </button>

    <div class="text-center mb-8">
        <img id="login-logo" src="{{ url_for('static', filename='images/dark-bat.png') }}" alt="Logo" class="w-16 h-16 mx-auto mb-4">
        <h1 class="text-3xl font-bold login-title">后台管理系统</h1>
        <p class="login-subtitle mt-2">口琴谱生成器 Jianpu to BD</p>
    </div>

    {% if error %}
    <div class="login-error px-4 py-3 rounded mb-6">
        <i class="ri-error-warning-line"></i>
        {{ error }}
    </div>
    {% endif %}

    <form method="POST" action="{{ url_for('login') }}">
        <div class="mb-6">
            <label class="block login-label text-sm font-bold mb-2" for="username">
                用户名
            </label>
            <div class="relative">
                <input
                    type="text"
                    id="username"
                    name="username"
                    required
                    class="w-full px-4 py-3 pl-10 login-input rounded-lg focus:outline-none transition"
                    placeholder="请输入用户名"
                >
                <i class="login-icon ri-user-line absolute left-3 top-3.5 text-xl"></i>
            </div>
        </div>

        <div class="mb-6">
            <label class="block login-label text-sm font-bold mb-2" for="password">
                密码
            </label>
            <div class="relative">
                <input
                    type="password"
                    id="password"
                    name="password"
                    required
                    class="w-full px-4 py-3 pl-10 login-input rounded-lg focus:outline-none transition"
                    placeholder="请输入密码"
                >
                <i class="login-icon ri-lock-line absolute left-3 top-3.5 text-xl"></i>
            </div>
        </div>

        <div class="flex items-center justify-between mb-6">
            <label class="flex items-center login-checkbox text-sm">
                <input type="checkbox" class="mr-2">
                记住我
            </label>
            <a href="#" class="login-link text-sm">
                忘记密码?
            </a>
        </div>

        <button
            type="submit"
            class="w-full login-btn font-bold py-3 px-4 rounded-lg transition duration-300 transform hover:scale-105"
        >
            登录
        </button>
    </form>

    <div class="mt-6 text-center text-sm login-footer">
        <p>默认账号: <span class="font-bold">admin</span></p>
        <p>默认密码: <span class="font-bold">admin123</span></p>
    </div>
</div>
{% endblock %}
